[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "ai-travel-planner-agent"
version = "0.1.0"
description = "Structured itinerary workflow for European city trips, with rule-based QA and PDF delivery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "tzdata>=2026.1",              # 时区数据库（Windows 没有系统自带的；任意城市的日落 / 日历时区要用）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: 需要真实 Ollama / 外部服务，默认不跑（pytest -m integration 手动触发）",
    "e2e: 需要前后端都在跑的浏览器验收，默认不跑（pytest -m e2e tests/e2e 手动触发）",
]
